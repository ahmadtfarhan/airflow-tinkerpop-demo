gremlin.graph=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerGraph
gremlin.tinkergraph.vertexIdManager=INTEGER
gremlin.tinkergraph.edgeIdManager=INTEGER
gremlin.tinkergraph.vertexPropertyIdManager=LONG

# TinkerGraph is in-memory.  graphLocation makes it write on clean shutdown and
# reload at startup, so a `docker compose restart` no longer wipes the demo
# graph.  (A hard kill still loses it -- scripts/reload_kg.sh is the real
# safety net.)  A missing file at first start is tolerated.
gremlin.tinkergraph.graphLocation=/opt/gremlin-server/data/crm-kg.kryo
gremlin.tinkergraph.graphFormat=gryo

# NOTE: this key is single-valued -- the previous config set it twice and the
# second silently won, so TinkerTextSearchFactory was never actually registered.
gremlin.tinkergraph.service=org.apache.tinkerpop.gremlin.tinkergraph.services.TinkerDegreeCentralityFactory
